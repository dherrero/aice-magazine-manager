name: aice-magazine-manager
services:
  postgresdb:
    image: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRESDB_USER}
      - POSTGRES_PASSWORD=${POSTGRESDB_PASSWORD}
      - POSTGRES_DB=${POSTGRESDB_DATABASE}
    volumes:
      - postgresdb:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    networks:
      - back-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRESDB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
  back:
    depends_on:
      - postgresdb
    build:
      context: .
      dockerfile: apps/app-back/Dockerfile
    container_name: back
    restart: unless-stopped
    environment:
      - NODE_PORT=${NODE_PORT}
      - POSTGRESDB_USER=${POSTGRESDB_USER}
      - POSTGRESDB_PASSWORD=${POSTGRESDB_PASSWORD}
      - POSTGRESDB_DATABASE=${POSTGRESDB_DATABASE}
      - POSTGRESDB_PORT=${POSTGRESDB_PORT}
      - POSTGRESDB_HOST=${POSTGRESDB_HOST}
      - NODE_JWT_SECRET=${NODE_JWT_SECRET}
      - NODE_JWT_ACCESS_EXPIRES_IN=${NODE_JWT_ACCESS_EXPIRES_IN}
      - NODE_JWT_REFRESH_EXPIRES_IN=${NODE_JWT_REFRESH_EXPIRES_IN}
      - NODE_HASH_SALT_ROUNDS=${NODE_HASH_SALT_ROUNDS}
      - NODE_PRODUCTION=${NODE_PRODUCTION}
      - NODE_UPLOAD_FILES=${NODE_UPLOAD_FILES}
    ports:
      - ${NODE_PORT}
    networks:
      - back-network
      - front-network
    volumes:
      - upload_files:/home/app-back/${NODE_UPLOAD_FILES}
      - tmp:/tmp

  front:
    build:
      context: .
      dockerfile: apps/app-front/Dockerfile
    container_name: front
    restart: unless-stopped
    ports:
      - ${FRONT_PORT}
    depends_on:
      - back
    networks:
      - front-network
      - back-network

volumes:
  postgresdb:
  upload_files:
  tmp:

networks:
  back-network:
  front-network:
