name: aice-magazine-manager
services:
  postgresdb:
    image: postgres:15
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRESDB_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRESDB_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRESDB_DATABASE:-aice_magazine}
    volumes:
      - postgresdb:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    networks:
      - back-aice-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
  back:
    depends_on:
      postgresdb:
        condition: service_healthy
    build:
      context: .
      dockerfile: apps/app-back/Dockerfile
    container_name: back
    restart: unless-stopped
    environment:
      - NODE_PORT=${NODE_PORT:-3200}
      - POSTGRESDB_USER=${POSTGRESDB_USER:-postgres}
      - POSTGRESDB_PASSWORD=${POSTGRESDB_PASSWORD:-postgres}
      - POSTGRESDB_DATABASE=${POSTGRESDB_DATABASE:-aice_magazine}
      - POSTGRESDB_PORT=${POSTGRESDB_PORT:-5432}
      - POSTGRESDB_HOST=postgresdb
      - NODE_JWT_SECRET=${NODE_JWT_SECRET:-your_jwt_secret_here}
      - NODE_JWT_ACCESS_EXPIRES_IN=${NODE_JWT_ACCESS_EXPIRES_IN:-15m}
      - NODE_JWT_REFRESH_EXPIRES_IN=${NODE_JWT_REFRESH_EXPIRES_IN:-7d}
      - NODE_HASH_SALT_ROUNDS=${NODE_HASH_SALT_ROUNDS:-10}
      - NODE_PRODUCTION=${NODE_PRODUCTION:-true}
      - NODE_UPLOAD_FILES=${NODE_UPLOAD_FILES:-uploads}
    ports:
      - "${NODE_PORT:-3200}"
    networks:
      - back-aice-network
    volumes:
      - upload_files:/home/app-back/${NODE_UPLOAD_FILES}
      - tmp:/tmp

  front:
    build:
      context: .
      dockerfile: apps/app-front/Dockerfile
    container_name: front
    restart: unless-stopped
    ports:
      - ${FRONT_PORT}
    depends_on:
      - back

volumes:
  postgresdb:
  upload_files:
  tmp:

networks:
  back-aice-network:
