<div class="search-container">
  <div class="search-input-container">
    <i class="lni lni-search search-icon"></i>
    <input
      type="text"
      class="search-input"
      [placeholder]="'search.placeholder' | transloco"
      formControlName="query"
      [attr.aria-label]="'search.searchInMagazines' | transloco"
    />
    <button
      type="button"
      class="clear-button"
      (click)="cleanQuery()"
      [ngbTooltip]="'search.clearSearch' | transloco"
      placement="left"
      [attr.aria-label]="'search.clearSearch' | transloco"
      *ngIf="search.get('query')?.value"
    >
      <i class="lni lni-close"></i>
    </button>
  </div>

  <div class="search-filters">
    <div class="filters-row">
      <div class="filter-group">
        <select
          class="filter-select"
          formControlName="type"
          [attr.aria-label]="'search.filterType' | transloco"
        >
          <option value="">{{ 'search.selectType' | transloco }}</option>
          @for(type of typeOptions; track $index){
          <option [value]="type">
            {{ typeDescription[$index] | transloco }}
          </option>
          }
        </select>
        <i class="lni lni-chevron-down select-icon"></i>
      </div>

      <div class="filter-group">
        <input
          type="number"
          class="filter-input"
          [placeholder]="'search.magazineNumberPlaceholder' | transloco"
          formControlName="number"
          [attr.aria-label]="'search.magazineNumber' | transloco"
        />
      </div>

      <button
        type="button"
        class="filter-button"
        (click)="searchByFilters()"
        [disabled]="!canApplyFilters()"
      >
        {{ 'search.applyFilters' | transloco }}
      </button>
    </div>

    <div class="active-filters" *ngIf="hasActiveFilters()">
      <small class="active-filters-text">{{
        'search.activeFilters' | transloco
      }}</small>
    </div>
  </div>
</div>
